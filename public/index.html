<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Academic Documents</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Upload Academic Documents</h1>
            <p>Select your PDF or ZIP file(s) and specify the topic for processing</p> <!-- Updated text -->
        </header>

        <main>
            <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="file-input" class="form-label">
                        Select File(s): <!-- Updated text -->
                        <span class="required">*</span>
                    </label>
                    <input type="file"
                           id="file-input"
                           name="files" 
                           class="file-input"
                           accept=".pdf,.zip"
                           multiple
                           required
                           aria-describedby="file-help">
                    <div id="file-help" class="form-help">
                        Accepted formats: PDF, ZIP (Max: 50MB per file) <!-- Updated text -->
                    </div>
                    <div id="file-info" class="file-info" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="topic-input" class="form-label">
                        Topic:
                        <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="topic-input"
                           name="topic"
                           class="text-input"
                           placeholder="e.g., Neural Networks and Deep Learning"
                           maxlength="100"
                           required
                           aria-describedby="topic-help">
                    <div id="topic-help" class="form-help">
                        Enter the main topic or subject of your document(s) <!-- Updated text -->
                    </div>
                </div>

                <button type="submit" id="upload-btn" class="btn btn-primary">
                    <span class="btn-text">Upload and Process</span>
                    <span class="btn-loader" style="display: none;">Processing...</span>
                </button>
            </form>

            <!-- Status and Progress Section - Now wrapped with id="status-section" -->
            <div id="status-section" class="status-section" style="display: none;">
                <div id="progress-container" class="progress-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div id="progress-text" class="progress-text">0%</div>

                <div id="status" class="status">
                    <div id="status-icon" class="status-icon"></div>
                    <div id="status-message" class="status-message"></div>
                </div>
            </div>

            <!-- Results Section - Now wrapped with id="results-section" -->
            <div id="results-section" class="results-section" style="display: none;">
                <h3>Processing Complete!</h3>
                <div id="download-links" class="download-links"></div>
            </div>

            <!-- Exam History/Browse Section -->
            <div id="exam-history-section" class="exam-history-section">
                <h3>Browse Generated Exams</h3>
                <ul id="exam-list" class="exam-list">
                    <!-- Exam items will be loaded here by JavaScript -->
                </ul>
            </div>
        </main>
    </div>

    <!-- NEW: Supabase client library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/upload.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
<!-- END OF FILE index.html -->
