<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Academic Documents</title>
    
    <!-- CSS Files with correct paths -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="container">
        <h1>Upload Academic Documents</h1>
        
        <form id="upload-form">
            <div class="upload-area">
                <input type="file" id="file-input" accept=".pdf,.zip" required>
                <label for="file-input">
                    <p>Click to select PDF or ZIP file</p>
                    <p class="hint">Maximum file size: 50MB</p>
                </label>
            </div>
            
            <input type="text" id="topic-input" placeholder="Enter topic (e.g., AI and Machine Learning)" required>
            <button type="submit" id="upload-btn">Upload and Process</button>
        </form>

        <div id="status-section" style="display: none;">
            <h2>Processing Status</h2>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="status-message"></div>
        </div>

        <div id="results-section" style="display: none;">
            <h2>Download Results</h2>
            <div id="download-links"></div>
        </div>
    </div>

    <!-- JavaScript Files with correct paths -->
    <script src="/js/utils.js"></script>
    <script src="/js/upload.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
